<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Desa Cimenteng</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(76,175,80,0.22), transparent 55%),
                  radial-gradient(900px 550px at 90% 30%, rgba(20,184,166,0.18), transparent 50%),
                  linear-gradient(180deg, #070b14, #0b1220);
      color: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(420px, 92vw);
      border-radius: 24px;
      background: rgba(20, 29, 43, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      padding: 36px 32px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: rgba(34,197,94,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo i {
      font-size: 28px;
      color: #22c55e;
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .login-header p {
      color: rgba(255,255,255,0.55);
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.76);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.065);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
    }

    input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, background 0.15s;
    }

    .btn-primary {
      background: #22c55e;
      color: #06110a;
    }

    .btn-primary:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }

    .login-footer a {
      color: #22c55e;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(6,17,10,0.3);
      border-top-color: #06110a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .login-card { padding: 28px 20px; }
      .login-header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Admin Login</h1>
    <p>Masuk untuk mengelola data tempat</p>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="admin@cimenteng.desa.id" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Masuk
    </button>
  </form>

  <div class="login-footer">
    <p>Kembali ke <a href="index.html">Peta Desa Cimenteng</a></p>
  </div>
</div>

<script src="api.js"></script>
<script>
(function() {
  'use strict';

  // If already logged in, redirect to admin
  if (CimentengAPI.isLoggedIn()) {
    window.location.replace('admin.html');
    return;
  }

  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    // Hide error
    errorMsg.classList.remove('visible');
    errorMsg.textContent = '';

    // Disable button
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Memproses...';

    CimentengAPI.login(email, password).then(function(result) {
      if (result.success) {
        // Redirect to admin panel
        window.location.replace('admin.html');
      } else {
        showError(result.message || 'Login gagal. Periksa email dan password.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Masuk';
      }
    }).catch(function(err) {
      showError(err.message || 'Terjadi kesalahan. Silakan coba lagi.');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Masuk';
    });
  });

  function showError(msg) {
    errorMsg.textContent = '❌ ' + msg;
    errorMsg.classList.add('visible');
  }

})();
</script>
</body>
</html>
